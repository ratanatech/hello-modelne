name: build

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'validate.js'
      - 'assets/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io

# Two builds racing would push the tag bumps to mnhafid/k3s out of order.
concurrency: build

env:
  IMAGE: ghcr.io/ratanatech/hello-modelne

jobs:
  build:
    runs-on: ubuntu-latest   # amd64, the same as the k3s nodes
    steps:
      - uses: actions/checkout@v4

      - run: node validate.test.js

      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}   # never reused

      # The cluster runs no image-automation controller, so the tag is written
      # into the GitOps repo here and Flux applies it.
      - uses: actions/checkout@v4
        with:
          repository: mnhafid/k3s
          token: ${{ secrets.K3S_DEPLOY_TOKEN }}
          path: k3s

      - working-directory: k3s
        run: |
          sed -i -E "s|^( *image: ).*|\1${IMAGE}:${{ steps.tag.outputs.tag }}|" apps/landing/deployment.yaml
          git diff --exit-code --quiet && exit 0
          git config user.name  "hello-modelne build"
          git config user.email "actions@github.com"
          git commit -am "landing: ${IMAGE}:${{ steps.tag.outputs.tag }}"
          git pull --rebase
          git push
